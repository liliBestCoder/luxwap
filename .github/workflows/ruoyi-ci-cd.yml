name: RuoYi CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'RuoYi/**'
      - '.github/workflows/ruoyi-ci-cd.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build RuoYi JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: |
          cd RuoYi
          mvn clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruoyi-admin-jar
          path: RuoYi/ruoyi-admin/target/ruoyi-admin.jar
          retention-days: 7

  deploy:
    name: Deploy to Remote Server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: ruoyi-admin-jar
          path: ./

      - name: Copy JAR to Remote Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "ruoyi-admin.jar"
          target: "/opt/ruoyi/"

      - name: Restart RuoYi Application on Remote Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            mkdir -p /opt/ruoyi /home/ruoyi/uploadPath
            cd /opt/ruoyi
            
            echo "Stopping existing RuoYi process..."
            PID=$(ps aux | grep 'ruoyi-admin.jar' | grep -v grep | awk '{print $2}')
            if [ -n "$PID" ]; then
              kill -9 $PID || true
              echo "Killed process $PID"
            fi
            
            echo "Starting new RuoYi process..."
            nohup java -Xms512m -Xmx1024m -jar /opt/ruoyi/ruoyi-admin.jar --server.port=8000 > /opt/ruoyi/app.log 2>&1 &
            
            sleep 5
            echo "=== Application Status ==="
            ps aux | grep 'ruoyi-admin.jar' | grep -v grep || echo "Process failed to start"
            echo "=== Application Logs ==="
            tail -n 20 /opt/ruoyi/app.log

<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxwap管理后台 - 登录</title>
    <link href="../css/style.css" rel="stylesheet"/>
    <link href="../css/buttons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/all.min.css">
    <script src="../JS/jquery.min.js"></script>
    <script src="../JS/common.js"></script>
    <style>
        /* 登录页面专属样式 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #e0f7fa, #e8f0fe);
            font-family: 'Arial', sans-serif;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            width: 360px;
            text-align: center;
        }

        .login-container h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #333;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-container button:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
    <!-- Cloudflare Turnstile 人机验证 SDK (仅在后端开启时加载) -->
    <script th:if="${turnstileEnabled}" src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<div class="login-container">
    <h1>Luxwap 管理后台</h1>
    <div class="error-message" id="errorMsg"></div>
    <input type="text" id="username" placeholder="用户名" autocomplete="username">
    <input type="password" id="password" placeholder="密码" autocomplete="current-password">

    <!-- Cloudflare Turnstile 验证容器 (仅在后台开启时展示) -->
    <div th:if="${turnstileEnabled}" style="margin-bottom: 20px; display: flex; justify-content: center;">
        <div class="cf-turnstile" th:data-sitekey="${turnstileSiteKey}" data-theme="light"></div>
    </div>

    <button id="loginBtn">登录</button>
</div>

<script th:inline="javascript">
    var ctx = [[@{/}]];
    var turnstileEnabled = [[${turnstileEnabled}]];
</script>

<script>
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            errorMsg.textContent = '用户名和密码不能为空';
            errorMsg.style.display = 'block';
            return;
        }

        let cfToken = '';
        if (turnstileEnabled) {
            const tokenInput = document.querySelector('[name="cf-turnstile-response"]');
            cfToken = tokenInput ? tokenInput.value : '';
            if (!cfToken) {
                errorMsg.textContent = '请先完成人机验证';
                errorMsg.style.display = 'block';
                return;
            }
        }

        errorMsg.style.display = 'none';

        const params = new URLSearchParams();
        params.append('username', username);
        params.append('password', password);
        params.append('rememberMe', 'true');
        if (turnstileEnabled && cfToken) {
            params.append('cfTurnstileToken', cfToken);
        }

        try {
            const res = await fetch(ctx + 'login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString(),
                credentials: 'include'
            });

            const data = await res.json();

            if (data.code !== 0) {
                // 如果开启了 Turnstile，重置人机验证
                if (window.turnstile) {
                    window.turnstile.reset();
                }
                errorMsg.textContent = data.msg || '登录失败，请重试';
                errorMsg.style.display = 'block';
                return;
            }

            location.href = ctx + 'index';

        } catch (err) {
            errorMsg.textContent = '网络错误，请稍后重试';
            errorMsg.style.display = 'block';
        }
    }

    loginBtn.addEventListener('click', login);

    document.getElementById('username').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') login();
    });
    document.getElementById('password').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>

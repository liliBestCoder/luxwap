        <!-- 显示设置 -->
        <div class="card" id="displayCard">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-list"></i> 显示设置
                </h3>
            </div>
            
            <div class="card-body">
                <!-- 每页显示记录数 -->
                <div class="form-group">
                    <label class="form-label" for="page-size-setting">每页显示记录数</label>
                    <div style="display: flex; gap: 15px; align-items: center;">
                        <select class="form-control-auto" id="page-size-setting" style="max-width: 200px;" onchange="updatePageSize(this.value)">
                            <option value="20" selected>20条/页</option>
                            <option value="50">50条/页</option>
                            <option value="100">100条/页</option>
                        </select>
                        <div style="color: var(--text-secondary); font-size: 13px;">
                            <i class="fas fa-info-circle"></i> 
                            此设置将应用到所有数据表格
                        </div>
                    </div>
                    <div style="margin-top: 10px;">
                        <button class="btn btn-success" onclick="saveDisplaySettings()">
                            <i class="fas fa-save"></i> 保存设置
                        </button>
                        <button class="btn btn-secondary" onclick="resetDisplaySettings()" style="margin-left: 10px;">
                            <i class="fas fa-undo"></i> 重置为默认
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="card" id="basicSettingsCard">
            <div class="card-header">
                <h3 class="card-title">

            <div class="card-body">

                    <div id="password-edit-form-1" style="display: block; margin-top: 10px;">
                        <div>
                            <input type="text" class="form-control-auto" th:value="${loginName}"  style="margin-bottom: 10px;" disabled>
                            <button class="btn btn-success" onclick="logout()">
                                <i class="fas fa-save"></i> 退出登录
                            </button>
                        </div>
                    </div>
                </div>
            </div>

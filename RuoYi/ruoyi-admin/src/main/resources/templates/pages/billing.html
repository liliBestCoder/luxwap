<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账单管理 - Luxwap管理后台</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/all.min.css">
</head>
<body>
    <div class="page-header">
        <h1 class="page-title">账单管理</h1>
    </div>

    <!-- 🔴收入趋势图 -->
    <div id="billingTrend" style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px;">
        <div class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h3 class="card-title">收入趋势</h3>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary btn-period" style="padding: 5px 10px;" onclick="switchTrendPeriod('day', this)">按日</button>
                    <button class="btn btn-primary btn-period" style="padding: 5px 10px;" onclick="switchTrendPeriod('month', this)">按月</button>
                    <button class="btn btn-secondary btn-period" style="padding: 5px 10px;" onclick="switchTrendPeriod('year', this)">按年</button>
                </div>
            </div>
            <div id="chart-trend-container" style="height: 300px; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end;">
                <!-- 动态柱状图由 billing.js 渲染 -->
            </div>
        </div>
        
        <div id="billingSource" class="card">
            <div class="card-header">
                <h3 class="card-title">收入分布</h3>
                <div style="display: flex; gap: 10px;">                  
                    <button class="btn btn-primary btn-source-period" style="padding: 5px 10px;" onclick="switchSourcePeriod('month', this)">按月</button>
                    <button class="btn btn-secondary btn-source-period" style="padding: 5px 10px;" onclick="switchSourcePeriod('year', this)">按年</button>
                </div>
            </div>
            <div id="chart-source-container" style="height: 300px; padding: 20px; display: flex; align-items: center; justify-content: center;">
                <!-- 动态饼图/环形图由 billing.js 渲染 -->
            </div>	
        </div>
    </div>

    <!-- 🔴账单筛选 -->
    <div class="card" id="billsearch">
        <div class="card-header">
            <h3 class="card-title">账单筛选</h3>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div>
                <label class="form-label">账单编号</label>
                <input type="text" class="form-control" placeholder="输入账单编号..." id="billNumber">
            </div>
            <div>
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" placeholder="输入客户名称..." id="customerName">
            </div>
            <div>
                <label class="form-label">首充用户</label>
                <select class="form-control" id="billStatus">
                    <option value="">全部用户</option>
                    <option value="newUser">是</option>
                    <option value="conUser">否</option>
                </select>
            </div>
            <div>
                <label class="form-label">日期范围</label>
                <input type="date" class="form-control" id="startDate">
            </div>
            <div>
                <label class="form-label">至</label>
                <input type="date" class="form-control" id="endDate">
            </div>
            <div style="display: flex; align-items: end; gap: 10px;">
                <button class="btn btn-primary" onclick="searchBills()">
                    <i class="fas fa-search"></i> 搜索
                </button>
                <button class="btn btn-secondary" onclick="clearBillFilter()">
                    <i class="fas fa-refresh"></i> 重置
                </button>
            </div>
        </div>
    </div>

    <!-- 🔴账单列表 -->
    <div class="card" id="billlist">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 class="card-title">账单列表</h3>
        </div>
        
        <div style="overflow-x: auto;">
            <table class="table" id="billsTable">
                <thead>
                    <tr>
                        <th>付款日期</th>
                        <th>账单编号</th>
                        <th>用户名</th>
                        <th>金额</th>
                        <th>有效期</th>
                        <th>首充客户</th>
                        <th>分润</th>
                        <th>归属</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="billsTableBody">
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            <i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i> 正在加载账单数据...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 🔴分页 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color);">
            <div id="pagination-info" style="color: var(--text-secondary);">
                显示 0 条记录
            </div>
            <div id="pagination-controls" style="display: flex; gap: 6px; align-items: center;">
                <button class="btn btn-secondary" id="btn-prev-page" style="padding: 5px 12px;" onclick="prevPage()" disabled>上一页</button>
                <span id="page-display" style="padding: 0 10px; font-weight: 500;">第 1 页</span>
                <button class="btn btn-secondary" id="btn-next-page" style="padding: 5px 12px;" onclick="nextPage()" disabled>下一页</button>
            </div>
        </div>
    </div>

    <!-- 🔴账单详情模态框 -->
    <div id="billModal" class="modal" onclick="if(event.target===this) closeBillModal()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: var(--card-bg, #fff); border-radius: 8px; width: 90%; max-width: 520px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden;">
            <div class="modal-header" style="padding: 16px 20px; border-bottom: 1px solid var(--border-color, #eee); display: flex; justify-content: space-between; align-items: center;">
                <h3 id="billModalTitle" style="margin: 0; font-size: 18px;">账单详情</h3>
                <span style="font-size: 24px; cursor: pointer; color: var(--text-secondary);" onclick="closeBillModal()">&times;</span>
            </div>
            <div class="modal-body" id="billDetails" style="padding: 20px;">
                <!-- 动态填充 -->
            </div>
            <div class="modal-footer" style="padding: 12px 20px; border-top: 1px solid var(--border-color, #eee); text-align: right;">
                <button class="btn btn-secondary" onclick="closeBillModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../JS/common.js" defer></script>
    <script src="../JS/billing.js" defer></script>
</body>
</html>

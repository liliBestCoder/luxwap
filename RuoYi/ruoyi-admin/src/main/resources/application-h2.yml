# 本地 H2 测试数据库配置（数据从线上 xray_partner 库完整镜像）
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: org.h2.Driver
    druid:
      # 主库数据源
      master:
        # H2 内存模式，开启 MySQL 兼容模式，初始化时自动加载导出的线上全量数据
        url: jdbc:h2:mem:xray_partner;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:sql/init_xray_partner_h2.sql'
        username: sa
        password: ""
      # 从库数据源
      slave:
        enabled: false
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 5
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false

# 测试环境关闭 Shiro 验证码校验
shiro:
  user:
    captchaEnabled: false

# 测试环境关闭 Cloudflare Turnstile 验证码
cloudflare:
  turnstile:
    enabled: false
